<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PropTrader AI v4</title>
<style>
:root{--bg:#07101d;--panel:#0f1b2d;--border:#273a55;--text:#edf4ff;--muted:#9db0c9;--green:#34d399;--red:#fb7185;--yellow:#fbbf24;--blue:#60a5fa}
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial;background:linear-gradient(#07101d,#0b1424);color:var(--text)}
header{position:sticky;top:0;background:#08111ff5;border-bottom:1px solid var(--border);padding:14px 20px;display:flex;justify-content:space-between;align-items:center;z-index:10}
main{max-width:1550px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:13px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:15px}.kpi{font-size:28px;font-weight:700;margin-top:6px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.right{margin-left:auto}.muted{color:var(--muted)}.small{font-size:12px}
.badge{padding:5px 10px;border-radius:999px;font-size:12px;font-weight:700}.buy{background:#064e3b;color:var(--green)}.sell{background:#5f1725;color:var(--red)}.wait{background:#5a4508;color:var(--yellow)}
.open{background:#15395b;color:#93c5fd}.closed{background:#344155;color:#e5e7eb}.tp{color:var(--green)}.sl{color:var(--red)}
button{background:#1d4ed8;border:1px solid #3b82f6;color:#fff;padding:9px 13px;border-radius:9px;cursor:pointer}
input,select{padding:9px;border-radius:8px;border:1px solid var(--border);background:#091525;color:#fff}
.signal{margin-top:12px}.status{width:10px;height:10px;border-radius:50%;background:var(--green);display:inline-block}
.tags{display:flex;gap:6px;flex-wrap:wrap}.tag{font-size:11px;border:1px solid var(--border);padding:3px 7px;border-radius:999px}
.progress{height:8px;background:#091525;border-radius:999px;overflow:hidden}.bar{height:100%;background:#3b82f6}
hr{border:none;border-top:1px solid var(--border);margin:12px 0}
</style>
</head>
<body>
<header>
<div><h1 style="margin:0;font-size:21px">PropTrader AI v4</h1><div class="muted small">Semnale automate • rezultate TP/SL • statistici • Telegram opțional</div></div>
<div class="row"><span class="status"></span><span id="statusText" class="muted small">Conectare...</span></div>
</header>
<main>
<div class="grid">
<div class="card"><div class="muted">Semnale totale</div><div class="kpi" id="total">0</div></div>
<div class="card"><div class="muted">Deschise</div><div class="kpi" id="openCount">0</div></div>
<div class="card"><div class="muted">Închise</div><div class="kpi" id="closedCount">0</div></div>
<div class="card"><div class="muted">Win rate</div><div class="kpi" id="winRate">0%</div></div>
<div class="card"><div class="muted">Total R</div><div class="kpi" id="totalR">0R</div></div>
<div class="card"><div class="muted">Profit factor</div><div class="kpi" id="pf">0</div></div>
<div class="card"><div class="muted">Scor mediu</div><div class="kpi" id="avgScore">0%</div></div>
<div class="card"><div class="muted">Probabilitate medie</div><div class="kpi" id="avgProb">0%</div></div>
</div>

<div class="card" style="margin-top:14px">
<div class="row"><h2>Filtre</h2>
<select id="symbolFilter" onchange="render()"><option value="">Toate instrumentele</option><option>US30</option><option>XAUUSD</option></select>
<select id="sideFilter" onchange="render()"><option value="">BUY + SELL</option><option>BUY</option><option>SELL</option></select>
<select id="statusFilter" onchange="render()"><option value="">Toate statusurile</option><option value="OPEN">Deschise</option><option value="CLOSED">Închise</option></select>
<select id="minScore" onchange="render()"><option value="0">Orice scor</option><option value="70">Minim 70</option><option value="80">Minim 80</option><option value="85">Minim 85</option></select>
<button class="right" onclick="loadData()">Actualizează</button>
</div>
</div>

<div class="card" style="margin-top:14px"><h2>Inbox și jurnal semnale</h2><div id="signals"><p class="muted">Se încarcă...</p></div></div>

<div class="card" style="margin-top:14px">
<h2>Administrare</h2>
<div class="row">
<input id="adminKey" type="password" placeholder="ADMIN_KEY">
<button onclick="testSignal()">Creează semnal test</button>
<button onclick="clearSignals()">Șterge toate semnalele</button>
</div>
</div>
</main>
<script>
const $=id=>document.getElementById(id);
const fmt=v=>Number(v||0).toLocaleString('ro-RO',{maximumFractionDigits:2});
let all=[],summary={};

async function loadData(){
 try{
  const d=await(await fetch('/api/signals',{cache:'no-store'})).json();
  all=d.signals||[];summary=d.stats||{};
  $('statusText').textContent='Actualizat '+new Date().toLocaleTimeString('ro-RO');
  stats();render();
 }catch(e){$('statusText').textContent='Eroare conexiune'}
}
function stats(){
 $('total').textContent=summary.total||0;
 $('openCount').textContent=summary.open||0;
 $('closedCount').textContent=summary.closed||0;
 $('winRate').textContent=fmt(summary.winRate||0)+'%';
 $('totalR').textContent=fmt(summary.totalR||0)+'R';
 $('pf').textContent=fmt(summary.profitFactor||0);
 $('avgScore').textContent=fmt(summary.avgScore||0)+'%';
 $('avgProb').textContent=fmt(summary.avgProbability||0)+'%';
}
function tagList(x){
 return [x.bos?'BOS':'',x.choch?'CHOCH':'',x.fvg?'FVG':'',x.liquidity_sweep?'Liquidity Sweep':'',x.vwap_confirm?'VWAP':'',x.mtf_confirm?'MTF':'',x.order_block_confirm?'Order Block':'']
 .filter(Boolean).map(t=>`<span class="tag">${t}</span>`).join('');
}
function render(){
 const sf=$('symbolFilter').value,df=$('sideFilter').value,st=$('statusFilter').value,ms=Number($('minScore').value||0);
 const s=all.filter(x=>(!sf||x.symbol.includes(sf))&&(!df||x.signal===df)&&(!st||x.status===st)&&Number(x.score||0)>=ms);
 $('signals').innerHTML=s.length?s.map(x=>`
 <div class="card signal">
  <div class="row">
   <b>${x.symbol}</b>
   <span class="badge ${x.signal.toLowerCase()}">${x.signal}</span>
   <span class="badge ${String(x.status||'OPEN').toLowerCase()}">${x.status||'OPEN'}</span>
   ${x.result?`<span class="${x.result==='SL'?'sl':'tp'}"><b>${x.result}</b> (${fmt(x.pnl_r)}R)</span>`:''}
   <span class="muted small">${x.timeframe||''}</span>
   <span class="muted small">${x.session_name||''}</span>
   <span class="right muted small">${new Date(x.received_at).toLocaleString('ro-RO')}</span>
  </div>
  <p>Entry: <b>${fmt(x.price)}</b> · SL: <b>${fmt(x.sl)}</b> · TP1: <b>${fmt(x.tp1)}</b>${Number(x.tp2)?` · TP2: <b>${fmt(x.tp2)}</b>`:''}${Number(x.tp3)?` · TP3: <b>${fmt(x.tp3)}</b>`:''}</p>
  <p>Scor: <b>${fmt(x.score)}%</b> · Probabilitate estimată: <b>${fmt(x.probability)}%</b>${Number(x.rr)?` · RR: <b>1:${fmt(x.rr)}</b>`:''}</p>
  <div class="progress"><div class="bar" style="width:${Math.min(100,Number(x.score||0))}%"></div></div>
  <p class="small">Trend: <b>${x.trend||'-'}</b> · MTF: <b>${x.mtf_trend||'-'}</b> · VWAP: <b>${x.vwap_side||'-'}</b></p>
  <p class="small">Structură: <b>${x.structure||'-'}</b> · OB: <b>${x.order_block||'-'}</b></p>
  <div class="tags">${tagList(x)}</div>
  <div class="muted small" style="margin-top:8px">${x.reason||''}</div>
  ${x.status==='OPEN'?`
  <hr><div class="row">
   <select id="res-${x.external_id}"><option>TP1</option><option>TP2</option><option>TP3</option><option>SL</option><option>BE</option></select>
   <button onclick="closeManual('${x.external_id}')">Închide manual</button>
  </div>`:''}
 </div>`).join(''):'<p class="muted">Nu există semnale pentru filtrele selectate.</p>';
}
async function closeManual(id){
 const result=$('res-'+id).value;
 const r=await fetch('/api/manual-close',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({adminKey:$('adminKey').value,external_id:id,result})});
 const d=await r.json();if(!d.ok)return alert(d.error||'Eroare');loadData();
}
async function testSignal(){
 const r=await fetch('/api/test-signal',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({adminKey:$('adminKey').value})});
 const d=await r.json();if(!d.ok)return alert(d.error||'Eroare');loadData();
}
async function clearSignals(){
 if(!confirm('Ștergi toate semnalele?'))return;
 const r=await fetch('/api/clear',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({adminKey:$('adminKey').value})});
 const d=await r.json();if(!d.ok)return alert(d.error||'Eroare');loadData();
}
loadData();setInterval(loadData,15000);
</script>
</body></html>
