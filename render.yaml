services:
  - type: web
    name: proptrader-ai-v1
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: WEBHOOK_KEY
        generateValue: true
      - key: ADMIN_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: proptrader-db
          property: connectionString

databases:
  - name: proptrader-db
    plan: free
