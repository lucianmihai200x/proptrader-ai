services:
  - type: web
    name: proptrader-ai-v1
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: WEBHOOK_KEY
        generateValue: true
      - key: ADMIN_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: proptrader-db
          property: connectionString
      - key: ANALYSIS_TIMEFRAME
        value: 15
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_ENABLED
        value: true
      - key: TELEGRAM_MIN_SCORE
        value: 85
      - key: TELEGRAM_MAX_RETRIES
        value: 2
      - key: AUTO_PATTERN_SIGNALS
        value: true
      - key: PATTERN_SIGNAL_MIN_SAMPLES
        value: 50
      - key: PATTERN_SIGNAL_MIN_PROBABILITY
        value: 75
      - key: PATTERN_SIGNAL_MIN_SCORE
        value: 85
      - key: WEBHOOK_STALE_MINUTES
        value: 35
      - key: SYSTEM_MONITOR_INTERVAL_MINUTES
        value: 5
      - key: TELEGRAM_SYSTEM_ALERTS
        value: true
      - key: NEWS_UNAVAILABLE_RISK
        value: 55

databases:
  - name: proptrader-db
    plan: free
