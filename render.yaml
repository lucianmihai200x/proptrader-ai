services:
  - type: web
    name: proptrader-ai-v1
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: WEBHOOK_KEY
        generateValue: true
      - key: ADMIN_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: proptrader-db
          property: connectionString
      - key: ANALYSIS_TIMEFRAME
        value: 15
      - key: ANALYSIS_TIMEFRAMES
        value: 5,15,30,60,240
      - key: SMC_ENABLED
        value: true
      - key: SMC_MIN_SCORE
        value: 68
      - key: SMC_NOTIFY_PENDING_SCORE
        value: 78
      - key: SMC_REQUIRE_M5_CONFIRMATION
        value: true
      - key: SMC_MAX_PENDING_PER_SYMBOL
        value: 15
      - key: SMC_MIN_BLOCK_SAMPLES
        value: 8
      - key: SMC_OVERLAP_THRESHOLD
        value: 0.5
      - key: BACKTEST_MIN_TRADING_DAYS
        value: 60
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_ENABLED
        value: true
      - key: TELEGRAM_MIN_SCORE
        value: 85
      - key: TELEGRAM_MAX_RETRIES
        value: 2
      - key: AUTO_PATTERN_SIGNALS
        value: true
      - key: PATTERN_SIGNAL_MIN_SAMPLES
        value: 50
      - key: PATTERN_SIGNAL_MIN_PROBABILITY
        value: 75
      - key: PATTERN_SIGNAL_MIN_SCORE
        value: 85
      - key: WEBHOOK_STALE_MINUTES
        value: 35
      - key: SYSTEM_MONITOR_INTERVAL_MINUTES
        value: 5
      - key: TELEGRAM_SYSTEM_ALERTS
        value: true
      - key: NEWS_UNAVAILABLE_RISK
        value: 55
      - key: NEWS_CALENDAR_UNAVAILABLE_RISK
        value: 35
      - key: OFFICIAL_NEWS_ENABLED
        value: true
      - key: NEWS_COUNTRIES
        value: US,DE,GERMANY,EU,EA,EURO AREA
      - key: FMP_ENABLED
        value: false

databases:
  - name: proptrader-db
    plan: free
