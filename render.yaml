services:
  - type: web
    name: proptrader-ai-v1
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: WEBHOOK_KEY
        generateValue: true
      - key: ADMIN_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: proptrader-db
          property: connectionString
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_ENABLED
        value: true
      - key: TELEGRAM_MIN_SCORE
        value: 85
      - key: TELEGRAM_MAX_RETRIES
        value: 2

databases:
  - name: proptrader-db
    plan: free
